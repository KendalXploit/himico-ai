name: himico_ai
description: "HIMICO AI — Institutional Futures Trading Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^14.2.0

  # Networking
  dio: ^5.4.3+1
  web_socket_channel: ^2.4.5
  connectivity_plus: ^6.0.3

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Charts
  fl_chart: ^0.68.0

  # UI / animation
  google_fonts: ^6.2.1
  glassmorphism: ^3.0.0
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  lottie: ^3.1.2
  animate_do: ^3.3.4
  percent_indicator: ^4.2.3

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  logger: ^2.3.0
  uuid: ^4.4.0
  path_provider: ^2.1.3
  image_picker: ^1.1.2
  share_plus: ^9.0.0
  csv: ^6.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  flutter_dotenv: ^5.1.0
  get_it: ^7.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/
    - .env
