name: Android Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: "3.34.0"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Analyze, test, and build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Prepare .env
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test || true

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: himico-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: himico-ai-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

# -----------------------------------------------------------------------------
# Notes:
# - `subosito/flutter-action` installs the exact Flutter version pinned above
#   and caches it between runs, so CI stays deterministic even as new Flutter
#   releases ship.
# - `flutter build apk`/`appbundle` regenerate the Gradle wrapper
#   (gradlew, gradlew.bat, gradle-wrapper.jar) automatically if missing —
#   no separate wrapper bootstrap step is needed.
# - Debug signing is used for the release build type (see
#   android/app/build.gradle) so this succeeds without secrets configured.
#   Add a signing step with GitHub Actions secrets before shipping to the
#   Play Store.
# -----------------------------------------------------------------------------
